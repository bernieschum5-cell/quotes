name: update-quotes

on:
  schedule:
    # 09:30 UTC = 北京时间 17:30，A 股收盘后
    - cron: "30 9 * * 1-5"
    # 10:30 UTC = 北京时间 18:30，兜底再跑一次
    - cron: "30 10 * * 1-5"
  workflow_dispatch:        # 允许在网页上手动点运行

permissions:
  contents: write

concurrency:
  group: update-quotes
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取报价
        env:
          ADJUST: "0"              # 0=不复权，配合 PP 的交易记录使用
          START_DATE: "2015-01-01" # 想要更长历史就往前改
        run: python fetch.py

      - name: 提交结果
        run: |
          git config user.name  "quotes-bot"
          git config user.email "quotes-bot@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "update quotes $(date -u +%F)"
            git push
          fi
